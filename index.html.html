<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MindBridge AI — ExamShield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: 'var(--bg)', surface: 'var(--surface)', surfacealt: 'var(--surface-alt)',
          border2: 'var(--border)', ink: 'var(--ink)', inksoft: 'var(--ink-soft)',
          brand: 'var(--brand)', branddark: 'var(--brand-dark)', brandlight: 'var(--brand-light)',
          gold: 'var(--gold)', goldlight: 'var(--gold-light)',
          alert: 'var(--alert)', alertlight: 'var(--alert-light)', calmblue: 'var(--calm-blue)'
        },
        fontFamily: { serif: ['Lora','ui-serif','Georgia','serif'], sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
        borderRadius: { sm2:'10px', md2:'16px', lg2:'24px' }
      }
    }
  }
</script>
<style>
  :root{
    --bg:#FAFBF8; --surface:#FFFFFF; --surface-alt:#F1F5F2; --border:#DDE6E1;
    --ink:#182420; --ink-soft:#52625C; --brand:#2D6A63; --brand-dark:#1F4B45; --brand-light:#E4EFEA;
    --gold:#B8862B; --gold-light:#F4E7CB; --calm-blue:#4A72A6; --alert:#B8483A; --alert-light:#F6E4E0;
    --shadow: 0 1px 2px rgba(24,36,32,.06), 0 4px 14px rgba(24,36,32,.05);
  }
  [data-theme="dark"]{
    --bg:#101613; --surface:#161D1A; --surface-alt:#1B2320; --border:#293430;
    --ink:#EAF1EE; --ink-soft:#9FB0AA; --brand:#5FA79B; --brand-dark:#3F7A70; --brand-light:#1D2C28;
    --gold:#E0B75E; --gold-light:#2C2618; --calm-blue:#7FA3D1; --alert:#E08876; --alert-light:#2E1E1B;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101613; --surface:#161D1A; --surface-alt:#1B2320; --border:#293430;
      --ink:#EAF1EE; --ink-soft:#9FB0AA; --brand:#5FA79B; --brand-dark:#3F7A70; --brand-light:#1D2C28;
      --gold:#E0B75E; --gold-light:#2C2618; --calm-blue:#7FA3D1; --alert:#E08876; --alert-light:#2E1E1B;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ background:var(--bg); color:var(--ink); }
  body{ font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.font-display{ font-family:'Lora',Georgia,serif; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:.5rem; font-weight:600; border-radius:12px; padding:.7rem 1.15rem; transition:transform .15s ease, opacity .15s ease, background .15s ease; cursor:pointer; border:1px solid transparent; font-size:.92rem; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--brand); color:#fff; }
  .btn-primary:hover{ background:var(--brand-dark); }
  .btn-gold{ background:var(--gold); color:#241a05; }
  .btn-gold:hover{ opacity:.9; }
  .btn-outline{ background:transparent; border-color:var(--border); color:var(--ink); }
  .btn-outline:hover{ background:var(--surface-alt); }
  .btn-alert{ background:var(--alert); color:#fff; }
  .btn-alert:hover{ opacity:.9; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); }
  .btn-ghost:hover{ background:var(--surface-alt); color:var(--ink); }
  .chip{ display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .75rem; border-radius:999px; font-size:.8rem; font-weight:600; border:1px solid var(--border); background:var(--surface-alt); color:var(--ink-soft); }
  input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.65rem .8rem; color:var(--ink); font-family:inherit; font-size:.92rem;
  }
  input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,.focusable:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  input[type=range]{ width:100%; accent-color:var(--brand); }
  ::placeholder{ color:var(--ink-soft); opacity:.7; }
  .scrollbar-thin::-webkit-scrollbar{ width:6px; height:6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background:var(--border); border-radius:99px; }
  .breathe-circle{ transition: transform 4s ease-in-out; }
  .breathe-in{ transform:scale(1.55); transition-duration:4s; }
  .breathe-hold{ transform:scale(1.55); transition-duration:.1s; }
  .breathe-out{ transform:scale(1); transition-duration:6s; }
  .fade-in{ animation:fadeIn .35s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .breathe-circle{ transition:none !important; } .fade-in{ animation:none !important; } }
  .sidebar-link{ display:flex; align-items:center; gap:.75rem; padding:.65rem .9rem; border-radius:12px; color:var(--ink-soft); font-weight:600; font-size:.92rem; }
  .sidebar-link.active{ background:var(--brand-light); color:var(--brand-dark); }
  .sidebar-link:hover:not(.active){ background:var(--surface-alt); }
  .bottom-tab{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:.62rem; font-weight:600; color:var(--ink-soft); padding:.35rem 0; flex:1; }
  .bottom-tab.active{ color:var(--brand-dark); }
  textarea{ resize:vertical; min-height:70px; }
  .msg-bubble{ max-width:78%; padding:.65rem .9rem; border-radius:16px; font-size:.9rem; line-height:1.45; }
  .msg-ai{ background:var(--surface-alt); color:var(--ink); border-bottom-left-radius:4px; }
  .msg-user{ background:var(--brand); color:#fff; border-bottom-right-radius:4px; margin-left:auto; }
  .typing-dot{ width:6px; height:6px; border-radius:99px; background:var(--ink-soft); display:inline-block; animation:blink 1.2s infinite ease-in-out; }
  .typing-dot:nth-child(2){ animation-delay:.2s; } .typing-dot:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; } 40%{ opacity:1; } }
  .toast{ background:var(--ink); color:var(--bg); border-radius:12px; padding:.7rem 1rem; font-size:.85rem; font-weight:600; box-shadow:var(--shadow); }
  .modal-backdrop{ background:rgba(16,20,18,.55); backdrop-filter:blur(2px); }
  ::selection{ background:var(--brand-light); }
</style>

<body class="min-h-screen">
<div id="toastRoot" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 items-end"></div>
<div id="modalRoot"></div>
<div id="app"></div>

<script>
/* =========================================================
   MINDBRIDGE AI — storage / services / state
   ========================================================= */
const SKEY = { users:'mb_users', session:'mb_session' };
const store = {
  get(k, fallback){ try{ const v = localStorage.getItem(k); return v===null? fallback : JSON.parse(v); }catch(e){ return fallback; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function uid(p){ return (p||'id')+'_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}); }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- crisis resources (India) — verified public sources ---------- */
const CRISIS_RESOURCES = {
  country: 'India',
  emergency: { label:'National Emergency Number', value:'112' },
  lines: [
    { name:'KIRAN Mental Health Helpline', value:'1800-599-0019', note:'Govt. of India — 24x7, toll-free, 13 languages' },
    { name:'Tele MANAS', value:'14416 / 1-800-891-4416', note:'Govt. of India tele-mental-health service, 24x7' }
  ],
  note:'These are official government-run helplines. Configure additional local/regional resources in crisisService.config as needed.'
};

/* ---------- auth service ---------- */
const authService = {
  getUsers(){ return store.get(SKEY.users, []); },
  saveUsers(u){ store.set(SKEY.users, u); },
  hash(pw){ return btoa(unescape(encodeURIComponent('mb::'+pw))); }, // demo-only, NOT production-secure
  signup(name, email, password){
    const users = this.getUsers();
    if(users.find(u=>u.email.toLowerCase()===email.toLowerCase())) return { ok:false, error:'An account with this email already exists.' };
    const user = { id: uid('user'), name, email, passHash: this.hash(password), createdAt: Date.now() };
    users.push(user); this.saveUsers(users);
    dataService.init(user.id, name);
    store.set(SKEY.session, user.id);
    return { ok:true, user };
  },
  login(email, password){
    const users = this.getUsers();
    const user = users.find(u=>u.email.toLowerCase()===email.toLowerCase());
    if(!user || user.passHash !== this.hash(password)) return { ok:false, error:'Incorrect email or password.' };
    store.set(SKEY.session, user.id);
    return { ok:true, user };
  },
  logout(){ store.del(SKEY.session); },
  currentUser(){
    const id = store.get(SKEY.session, null);
    if(!id) return null;
    return this.getUsers().find(u=>u.id===id) || null;
  },
  resetPasswordDemo(email, newPassword){
    const users = this.getUsers();
    const user = users.find(u=>u.email.toLowerCase()===email.toLowerCase());
    if(!user) return { ok:false, error:'No account found with that email.' };
    user.passHash = this.hash(newPassword); this.saveUsers(users);
    return { ok:true };
  }
};

/* ---------- per-user data service ---------- */
function dataKey(uidStr){ return 'mb_data_' + uidStr; }
const dataService = {
  init(userId, name){
    const blank = {
      profile:{ name, ageRange:'', exam:'', stage:'', attemptType:'', examDate:'', pressureSources:[], supportPrefs:[], academicSelf:'', pressureLevel:5, onboardingComplete:false, onboardingStep:1, wellbeingBaseline:null },
      checkins:[], mockTests:[], conversations:[], trustedContacts:[], safetyEvents:[],
      phase:'preparation',
      resultPeriodActive:false,
      settings:{ theme:'light', notifDailyReminder:true, reminderTime:'20:00', accessibilityLargeText:false, reducedMotion:false, aiTone:'warm', emergencyLocation:'India', dataLocalOnly:true },
      studyBalance:{ date: todayISO(), items:[] }
    };
    store.set(dataKey(userId), blank);
    return blank;
  },
  get(userId){ return store.get(dataKey(userId), null); },
  save(userId, data){ store.set(dataKey(userId), data); },
  update(userId, patchFn){
    const data = this.get(userId) || this.init(userId, '');
    patchFn(data);
    this.save(userId, data);
    return data;
  }
};

/* ---------- pattern detection service (rule-based, non-clinical) ---------- */
const patternService = {
  level(checkins){
    if(!checkins || checkins.length===0) return { level:'none', message:null };
    const recent = checkins.slice(-5);
    const elevatedCount = recent.filter(c=> c.stress>=7 && c.sleep<=4 && c.motivation<=4).length;
    const avgStress = recent.reduce((s,c)=>s+c.stress,0)/recent.length;
    if(elevatedCount>=2){
      return { level:'elevated', message:"Your recent check-ins show a pattern of high stress and reduced wellbeing — several nights of poor sleep alongside high reported pressure." };
    }
    if(avgStress>=6){
      return { level:'moderate', message:"Your recent check-ins suggest you may be under significant pressure lately." };
    }
    return { level:'low', message:"Your recent check-ins look relatively steady." };
  },
  insights(checkins){
    const out = [];
    if(!checkins || checkins.length<3) return out;
    const recent = checkins.slice(-14);
    const avgSleep = recent.reduce((s,c)=>s+c.sleep,0)/recent.length;
    const poorSleepNights = recent.filter(c=>c.sleep<=4).length;
    if(poorSleepNights>=3) out.push("You've reported several nights of reduced sleep in your recent check-ins.");
    const highPressure = recent.filter(c=>c.pressure>=7).length;
    if(highPressure/recent.length > 0.5) out.push("You tend to report lower motivation when pressure is high.");
    if(avgSleep<5) out.push("Your average reported sleep quality has been on the lower side recently.");
    return out;
  }
};

/* ---------- safety / crisis detection ---------- */
const CRISIS_PATTERNS = [
  /want(ing)?\s+to\s+die/i, /suicid/i, /kill\s+myself/i, /end\s+my\s+life/i, /end\s+it\s+all/i,
  /hurt\s+myself/i, /harm\s+myself/i, /self[\s-]?harm/i, /no\s+reason\s+to\s+live/i,
  /can'?t\s+go\s+on/i, /not\s+safe/i, /unsafe\s+right\s+now/i, /plan\s+to\s+hurt/i, /better\s+off\s+dead/i
];
function detectCrisisLanguage(text){ return CRISIS_PATTERNS.some(r=>r.test(text)); }

/* ---------- AI service (rule-based, context-aware, non-diagnostic) ---------- */
const aiService = {
  buildContext(data){
    const lastCheckin = data.checkins[data.checkins.length-1] || null;
    const lastMock = data.mockTests[data.mockTests.length-1] || null;
    return {
      exam: data.profile.exam || 'your exam', stage: data.profile.stage || '',
      phase: data.phase, lastCheckin, lastMock,
      pattern: patternService.level(data.checkins)
    };
  },
  detectSupportNeed(text){ return detectCrisisLanguage(text); },
  generateResponse(userText, data){
    const ctx = this.buildContext(data);
    if(this.detectSupportNeed(userText)){
      return {
        mode:'crisis',
        text: "Thank you for telling me. That sounds like a lot to carry right now, and I want to take it seriously. I can stay with you in this conversation, but I'm not a replacement for immediate human help — would you consider reaching out to a trusted person or a helpline right now? I've opened some immediate support options for you."
      };
    }
    const t = userText.toLowerCase();
    const examName = ctx.exam || 'your exam';
    if(/overwhelm|too much|can'?t handle|drowning/.test(t)){
      return { mode:'normal', text: `It makes sense that ${examName} preparation can feel like a lot to carry, especially during ${ctx.phase.replace('-',' ')}. Would it help to take a moment to ground yourself first, or would you rather talk through what's feeling heaviest right now?` };
    }
    if(/mock|score|marks|result of the test|test result/.test(t)){
      const mockLine = ctx.lastMock ? ` I can see your last mock was ${ctx.lastMock.score}/${ctx.lastMock.max} — one number doesn't capture your whole preparation.` : '';
      return { mode:'normal', text: `Mock-test results can bring up a lot of feeling, especially when you've put in real effort.${mockLine} Would you like emotional support first, or to look at the pattern together?` };
    }
    if(/scared|afraid|nervous|anxious about (my )?result|waiting for (my )?result/.test(t)){
      return { mode:'normal', text: "Waiting on a result can be one of the hardest parts of this whole journey — the uncertainty itself is exhausting. Whatever happens, you don't have to face it alone. Is there someone you trust who could sit with you through this waiting period?" };
    }
    if(/parents|family|expect/.test(t)){
      return { mode:'normal', text: "Family expectations can add a whole extra layer of pressure on top of your own. Your worth isn't decided by one exam, even if it doesn't feel that way right now. What's the hardest part of the family pressure for you at the moment?" };
    }
    if(/sleep|can'?t sleep|insomnia|tired/.test(t)){
      const sleepLine = ctx.lastCheckin ? ` Your last check-in showed a sleep quality of ${ctx.lastCheckin.sleep}/10.` : '';
      return { mode:'normal', text: `Sleep and stress often feed each other, so this is really worth paying attention to.${sleepLine} Would a short wind-down routine or a breathing exercise help tonight?` };
    }
    if(/falling behind|behind in|not enough time|syllabus/.test(t)){
      return { mode:'normal', text: "Feeling behind can create a lot of pressure on its own, separate from the actual studying. Would it help to look at what feels manageable today, rather than the whole syllabus at once?" };
    }
    if(/lonely|isolat|no one understands|alone/.test(t)){
      return { mode:'normal', text: "Preparation like this can feel isolating, even in a room full of other students doing the same thing. I'm glad you're talking about it here — is there someone in your life you could also reach out to today?" };
    }
    if(/proud|good|better|okay today|feeling fine|motivated/.test(t)){
      return { mode:'normal', text: "That's genuinely good to hear — it's worth noticing the moments that feel steadier too, not only the hard ones. What's been helping today?" };
    }

    // Practical free-text answers for common study questions.
    if(/how (do|can) i study|how should i study|study plan|timetable|schedule/.test(t)){
      return { mode:'normal', text: `For ${examName}, try a simple cycle: 1) choose one priority topic, 2) study for 45–50 minutes, 3) take a 10-minute break, 4) solve practice questions, and 5) spend 10 minutes reviewing mistakes. Keep only 2–3 important targets for the day so the plan stays realistic.` };
    }
    if(/concentrat|focus|distract|phone|procrastinat/.test(t)){
      return { mode:'normal', text: "Try a 25-minute focus block: keep your phone away, choose one very specific task, and start with just five minutes. When the block ends, take a short break and repeat. The goal is not perfect concentration — it is getting started and returning to the task." };
    }
    if(/motivat|lazy|can't start|cannot start|don't feel like studying/.test(t)){
      return { mode:'normal', text: "You don't need to feel motivated before starting. Make the first task extremely small: open the chapter, review one concept, or solve five questions. Once you begin, momentum often makes the next step easier." };
    }
    if(/revise|revision|remember|memorize|forget/.test(t)){
      return { mode:'normal', text: "For revision, use active recall instead of repeatedly rereading. Close the book and write what you remember, solve a few questions without looking at the answer, then review only the gaps. Revisit difficult topics after a short interval rather than trying to memorize everything in one sitting." };
    }
    if(/exam strategy|test strategy|during (the )?exam|exam hall|time management/.test(t)){
      return { mode:'normal', text: "A useful exam strategy is to secure the questions you know first, mark uncertain ones for review, and keep a fixed amount of time for checking. Avoid spending too long on one difficult question at the cost of several easier ones." };
    }
    if(/today|tonight|what should i do/.test(t)){
      return { mode:'normal', text: "For today, pick one high-priority topic, one practice set, and one short revision task. Add a proper meal, a short movement break, and a realistic stopping time. A smaller plan you complete is more useful than a huge plan that creates more pressure." };
    }
    if(/help me|what can you do|what do you do|can you help/.test(t)){
      return { mode:'normal', text: "Yes. You can talk to me about exam stress, study planning, concentration, sleep, mock-test pressure, family expectations, motivation, or feeling behind. You can also ask me a specific question, and I'll give you a practical response based on your MindBridge profile." };
    }
    return { mode:'normal', text: `I hear you. Based on your ${examName} preparation, I can help you work through this. Tell me the specific problem or question — for example, "make me a study plan", "I can't concentrate", "I scored badly in my mock", or "I'm scared about the exam" — and I'll respond with practical next steps.` };
  },
  suggestedPrompts(){
    return ["I'm overwhelmed by NEET.", "I scored badly in my mock test.", "I'm scared about my result.", "My parents expect a lot from me.", "I haven't been sleeping properly.", "I feel like I'm falling behind."];
  }
};

/* ---------- professional support directory (demo entries, clearly labeled) ---------- */
const professionalDirectory = [
  { id:'p1', name:'(Demo) Dr. Anika Rao', type:'Psychiatrist', mode:'Online & in-person', location:'Delhi NCR', demo:true },
  { id:'p2', name:'(Demo) Meera Counselling Collective', type:'Counsellor', mode:'Online', location:'Bengaluru', demo:true },
  { id:'p3', name:'(Demo) Dr. Sanjay Iyer', type:'Psychologist', mode:'In-person', location:'Mumbai', demo:true },
  { id:'p4', name:'(Demo) City Care Emergency Dept.', type:'Hospital / emergency department', mode:'In-person', location:'Pan-India', demo:true },
  { id:'p5', name:'(Demo) Wellspring Student Counselling', type:'Counsellor', mode:'Online', location:'Pune', demo:true },
  { id:'p6', name:'(Demo) Dr. Farah Sheikh', type:'Psychiatrist', mode:'Online', location:'Hyderabad', demo:true }
];

/* =========================================================
   TOAST / MODAL
   ========================================================= */
function toast(msg){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className='toast fade-in'; el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function openModal(innerHtml, opts){
  opts = opts||{};
  document.getElementById('modalRoot').innerHTML = `
  <div class="fixed inset-0 z-[90] modal-backdrop flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target===this) closeModal()">
    <div class="card w-full sm:max-w-lg max-h-[92vh] overflow-y-auto scrollbar-thin rounded-b-none sm:rounded-b-[16px] fade-in" role="dialog" aria-modal="true">
      ${innerHtml}
    </div>
  </div>`;
}

/* =========================================================
   ROUTER
   ========================================================= */
const PROTECTED_PREFIXES = ['/onboarding','/dashboard','/examshield','/chat','/wellbeing','/support','/trusted-contact','/profile','/settings','/dev'];
function currentPath(){ return (location.hash || '#/').slice(1) || '/'; }
function navigate(path){ location.hash = '#'+path; }
function isProtected(path){ return PROTECTED_PREFIXES.some(p=> path===p || path.startsWith(p+'/')); }

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', ()=>{ applyTheme(); render(); });

function applyTheme(){
  const user = authService.currentUser();
  if(user){
    const data = dataService.get(user.id);
    if(data && data.settings && data.settings.theme){
      document.documentElement.setAttribute('data-theme', data.settings.theme);
    }
  }
}

function requireData(){
  const user = authService.currentUser();
  if(!user) return null;
  return dataService.get(user.id) || dataService.init(user.id, user.name);
}

function render(){
  const path = currentPath();
  const user = authService.currentUser();

  if(isProtected(path) && !user){ navigate('/login'); return; }
  if(user){
    const data = requireData();
    if(path.startsWith('/onboarding') === false && !data.profile.onboardingComplete && isProtected(path)){
      navigate('/onboarding'); return;
    }
    if((path==='/' || path==='/login' || path==='/signup') ){
      navigate(data.profile.onboardingComplete ? '/dashboard' : '/onboarding'); return;
    }
  }

  const app = document.getElementById('app');
  let html = '';
  if(path==='/') html = pageLanding();
  else if(path==='/login') html = pageLogin();
  else if(path==='/signup') html = pageSignup();
  else if(path.startsWith('/onboarding')) html = withShell(pageOnboarding(), {bare:true});
  else if(path==='/dashboard') html = withShell(pageDashboard());
  else if(path==='/examshield') html = withShell(pageExamShieldHome());
  else if(path==='/examshield/check-in') html = withShell(pageCheckIn());
  else if(path==='/examshield/timeline') html = withShell(pageTimeline());
  else if(path==='/examshield/mock-test') html = withShell(pageMockTest());
  else if(path==='/examshield/exam-calm') html = withShell(pageExamCalm());
  else if(path==='/examshield/recovery') html = withShell(pageRecovery());
  else if(path==='/chat') html = withShell(pageChat());
  else if(path==='/wellbeing') html = withShell(pageWellbeing());
  else if(path==='/support') html = withShell(pageSupport());
  else if(path==='/trusted-contact') html = withShell(pageTrustedContact());
  else if(path==='/profile') html = withShell(pageProfile());
  else if(path==='/settings') html = withShell(pageSettings());
  else if(path==='/dev') html = withShell(pageDev());
  else html = withShell(page404());

  app.innerHTML = html;
  window.scrollTo(0,0);
  afterRender(path);
}

function afterRender(path){
  if(path==='/chat') { scrollChatToBottom(); }
  if(path==='/examshield/exam-calm'){ /* breathing controlled via App fns */ }
}

function wellbeingCharts(range){
  const data = requireData();
  const cutoff = daysAgo(range);
  const points = data.checkins.filter(c=>c.date>=cutoff);
  if(points.length===0) return `<div class="card p-5"><p class="text-sm" style="color:var(--ink-soft);">No check-ins in this range yet. <a href="#/examshield/check-in" class="font-semibold underline">Start a check-in</a>.</p></div>`;
  return ['stress','sleep','motivation','overwhelmed'].map(key=>`
    <div class="card p-5 mb-4">
      <div class="font-semibold text-sm mb-2">${key[0].toUpperCase()+key.slice(1)} over time</div>
      ${svgLineChart(points, key)}
    </div>`).join('');
}
function svgLineChart(points, key){
  const w=600, h=140, pad=24;
  const xs = points.map((p,i)=> pad + (i*(w-2*pad))/Math.max(1,points.length-1));
  const ys = points.map(p=> h-pad - ((p[key]/10)*(h-2*pad)));
  const path = xs.map((x,i)=> (i===0?'M':'L')+x.toFixed(1)+','+ys[i].toFixed(1)).join(' ');
  const dots = xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3" fill="var(--brand)"></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full h-auto" role="img" aria-label="${key} trend chart">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--border)"></line>
    <path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2"></path>
    ${dots}
  </svg>`;
}
function insightsList(data){
  const list = patternService.insights(data.checkins);
  if(list.length===0) return `<p class="text-sm mt-2" style="color:var(--ink-soft);">Keep checking in and insights will appear here over time.</p>`;
  return `<div class="flex flex-col gap-3 mt-3">
    ${list.map(t=>`

/* =========================================================
   ONBOARDING OPTION CLICK HANDLER
   Uses event delegation so dynamically rendered option cards remain
   clickable even when the page is opened from a local file preview.
   ========================================================= */
document.addEventListener('click', function(e){
  const option = e.target.closest('.ob-option');
  if(!option) return;
  const group = option.dataset.obGroup;
  const value = option.dataset.obValue;
  const form = option.closest('form');
  if(!group || !form) return;
  const radio = option.querySelector('input[type="radio"]');
  if(!radio) return;

  form.querySelectorAll(`input[type="radio"][name="${group}"]`).forEach(input=>{
    input.checked = (input === radio);
  });
  form.querySelectorAll(`.ob-option[data-ob-group="${group}"]`).forEach(card=>{
    const selected = card === option;
    card.setAttribute('aria-pressed', String(selected));
    card.style.borderColor = selected ? 'var(--brand)' : '';
    card.style.boxShadow = selected ? '0 0 0 2px var(--brand) inset' : '';
    card.classList.toggle('ring-2', selected);
  });
});

document.addEventListener('keydown', function(e){
  const option = e.target.closest('.ob-option');
  if(!option || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault();
  option.click();
});

        d.checkins.push({ id: uid('ci'), date: todayISO(), stress:d.profile.wellbeingBaseline.stress, sleep:d.profile.wellbeingBaseline.sleep, overwhelmed:d.profile.wellbeingBaseline.overwhelmed, pressure:d.profile.pressureLevel||5, hope:5, motivation:d.profile.wellbeingBaseline.motivation });
      }
    });

  },

  showMockPattern(mockId){

  /* ---- exam calm: breathing ---- */
  _breath:{ timer:null, phaseTimer:null, running:false, remaining:0 },
  breathStart(){
    if(this._breath.running) return;
    this._breath.running = true;
    const dur = parseInt(document.getElementById('breath-duration').value,10);
    this._breath.remaining = dur;
    this._runBreathCycle();
    this._breath.timer = setInterval(()=>{
      this._breath.remaining--;
      const el = document.getElementById('breath-timer');
      if(el) el.textContent = this._breath.remaining>0 ? `${Math.floor(this._breath.remaining/60)}:${String(this._breath.remaining%60).padStart(2,'0')} remaining` : '';
      if(this._breath.remaining<=0){ this.breathPause(); toast('Breathing exercise complete.'); }
    },1000);
  },
  _runBreathCycle(){
    const circle = document.getElementById('breath-circle'); const label = document.getElementById('breath-label');
    if(!circle) return;
    const cycle = ()=>{
      if(!this._breath.running) return;
      circle.className='breathe-circle breathe-in absolute inset-6 rounded-full flex items-center justify-center text-sm font-semibold';
      circle.style.background='var(--brand-light)'; circle.style.color='var(--brand-dark)';
      label.textContent='Inhale';
      this._breath.phaseTimer = setTimeout(()=>{
        if(!this._breath.running) return;
        circle.className='breathe-circle breathe-hold absolute inset-6 rounded-full flex items-center justify-center text-sm font-semibold';
        label.textContent='Hold';
        this._breath.phaseTimer = setTimeout(()=>{
          if(!this._breath.running) return;
          circle.className='breathe-circle breathe-out absolute inset-6 rounded-full flex items-center justify-center text-sm font-semibold';
          label.textContent='Exhale';
          this._breath.phaseTimer = setTimeout(cycle, 6000);
        },4000);
      },4000);
    };
    cycle();
  },
  breathPause(){
    this._breath.running=false;
    clearInterval(this._breath.timer); clearTimeout(this._breath.phaseTimer);
    const label=document.getElementById('breath-label'); if(label) label.textContent='Paused';
  },
  breathRestart(){
    this.breathPause();
    const circle = document.getElementById('breath-circle');
    if(circle){ circle.className='breathe-circle absolute inset-6 rounded-full flex items-center justify-center text-sm font-semibold'; }
    const label = document.getElementById('breath-label'); if(label) label.textContent='Ready';
    const timerEl = document.getElementById('breath-timer'); if(timerEl) timerEl.textContent='';
  },
  startWindDown(){
    toast('2-minute wind-down started — dim your lights and put your phone aside.');
    this.breathStart();
  },

  /* ---- grounding ---- */
  _groundStep:0,
  groundingNext(){
    this._groundStep = Math.min(5, this._groundStep+1);
    document.getElementById('grounding-body').innerHTML = groundingStepView(this._groundStep);
  },
  groundingRestart(){
    this._groundStep = 0;
    document.getElementById('grounding-body').innerHTML = groundingStepView(0);
  },

  /* ---- chat ---- */
  handleChatSubmit(e){
    e.preventDefault();
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if(!text) return false;
    input.value='';
    this.sendChat(text);
    return false;
  },
  sendChat(text){
    try {
      const cleanText = String(text || '').trim();
      if(!cleanText) return false;
      const user = authService.currentUser();
      if(!user){
        toast('Please log in to use Talk to AI.');
        navigate('/login');
        return false;
      }

      let data = dataService.update(user.id, d=>{
        d.conversations.push({ id: uid('msg'), role:'user', text:cleanText, ts:Date.now() });
      });

      const scroll = document.getElementById('chat-scroll');
      if(!scroll){
        toast('Chat is still loading. Please try again.');
        return false;
      }

      scroll.innerHTML = renderChatMessages(data.conversations) +
        `<div id="chat-typing" class="msg-bubble msg-ai"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;

      const form = document.querySelector('#app form');
      const promptsBar = form ? form.previousElementSibling : null;
      if(promptsBar && promptsBar.classList.contains('flex-wrap')) promptsBar.remove();
      scrollChatToBottom();

      setTimeout(()=>{
        try {
          const resp = aiService.generateResponse(cleanText, data);
          const isCrisis = resp.mode==='crisis';
          data = dataService.update(user.id, d=>{
            d.conversations.push({ id:uid('msg'), role:'ai', text:resp.text, ts:Date.now() });
            if(isCrisis) d.safetyEvents.push({ id:uid('se'), date:new Date().toISOString(), context:'chat' });
          });
          const updatedScroll = document.getElementById('chat-scroll');
          if(updatedScroll){
            updatedScroll.innerHTML = renderChatMessages(data.conversations);
            scrollChatToBottom();
          }
          if(isCrisis) this.openNeedHelp(true);
        } catch(err) {
          console.error('MindBridge AI response error:', err);
          const fallback = "I’m here with you. I couldn't process that message just now. Please try asking in a shorter sentence, such as “I’m overwhelmed”, “make me a study plan”, or “I can’t concentrate”.";
          dataService.update(user.id, d=>{
            d.conversations.push({ id:uid('msg'), role:'ai', text:fallback, ts:Date.now() });
          });
          render();
        }
      }, 500);
      return true;
    } catch(err) {
      console.error('MindBridge chat error:', err);
      toast('Something went wrong in chat. Please refresh the page and try again.');
      return false;
    }
  },
  newConversation(){
    const user = authService.currentUser();
    dataService.update(user.id, d=>{ d.conversations = []; });
    render();
  },
  clearConversation(){ this.newConversation(); },

  /* ---- wellbeing ---- */
  setWbRange(r){ window.__wbRange = r; document.getElementById('wb-charts').innerHTML = wellbeingCharts(r); render.__skip=false; document.querySelectorAll('.chip').forEach(()=>{}); render(); },

  /* ---- professional support filter ---- */

  saveContact(e, contactId){

      if(contactId){ const c=d.trustedContacts.find(x=>x.id===contactId); Object.assign(c,{name,relationship,phone,email}); }

    });

  },
  removeContact(contactId){
    const user = authService.currentUser();

  copyMessageTemplate(name){

    navigator.clipboard && navigator.clipboard.writeText(msg).catch(()=>{});
    toast('Message template copied.');
  },

  /* ---- profile / settings ---- */

    e.preventDefault();
    const user = authService.currentUser();
    dataService.update(user.id, d=>{
      d.profile.name = document.getElementById('pf-name').value.trim() || d.profile.name;
      d.profile.ageRange = document.getElementById('pf-age').value;
      d.profile.exam = document.getElementById('pf-exam').value;
      d.profile.stage = document.getElementById('pf-stage').value;
      d.profile.attemptType = document.getElementById('pf-attempt').value;

    });

  },
  saveSettings(e){
    e.preventDefault();
    const user = authService.currentUser();
    dataService.update(user.id, d=>{
      d.settings.notifDailyReminder = document.getElementById('st-notif').checked;
      d.settings.reminderTime = document.getElementById('st-time').value;
      d.settings.theme = document.getElementById('st-theme').value;
      d.settings.accessibilityLargeText = document.getElementById('st-large').checked;
      d.settings.reducedMotion = document.getElementById('st-motion').checked;

    });

    document.documentElement.style.fontSize = dataService.get(user.id).settings.accessibilityLargeText ? '108%' : '100%';
    toast('Settings saved.'); return false;
  },
  openPrivacy(){
    openModal(`
    <div class="p-6">
      <h2 class="font-display font-semibold text-lg">Privacy</h2>
      <p class="text-sm mt-3 font-semibold">What information does MindBridge use?</p>
      <ul class="text-sm mt-2 flex flex-col gap-2" style="color:var(--ink-soft);">
        <li><strong style="color:var(--ink);">Exam context</strong> — so support reflects your exam and stage.</li>
        <li><strong style="color:var(--ink);">Wellbeing check-ins</strong> — to notice patterns over time.</li>
        <li><strong style="color:var(--ink);">Mock test information</strong> — to offer relevant recovery support.</li>
        <li><strong style="color:var(--ink);">Conversation history</strong> — so the AI keeps context within a conversation.</li>
        <li><strong style="color:var(--ink);">Support preferences</strong> — to tailor what's offered to you.</li>
      </ul>
      <p class="text-xs mt-4" style="color:var(--ink-soft);">Your wellbeing data should be handled carefully. In this Version 1 demo, all data is stored locally in your browser only and is not sent to any server. This is not a HIPAA- or GDPR-compliant clinical system.</p>
      <button onclick="closeModal()" class="btn btn-primary w-full mt-4">Close</button>
    </div>`);
  },
  confirmDeleteData(){
    openModal(`
    <div class="p-6">
      <h2 class="font-display font-semibold text-lg">Delete local data</h2>
      <p class="text-sm mt-2" style="color:var(--ink-soft);">This permanently removes your MindBridge data from this browser, including check-ins, mock tests and conversations. This can't be undone.</p>
      <div class="flex gap-2 mt-4"><button onclick="closeModal()" class="btn btn-outline flex-1">Cancel</button><button onclick="App.deleteData()" class="btn btn-alert flex-1">Delete</button></div>
    </div>`);
  },
  deleteData(){
    const user = authService.currentUser();
    store.del(dataKey(user.id));
    const users = authService.getUsers().filter(u=>u.id!==user.id);
    authService.saveUsers(users);
    authService.logout();
    closeModal(); navigate('/');
  },

  /* ---- need help now ---- */
  openNeedHelp(fromCrisisChat){
    const r = CRISIS_RESOURCES;
    openModal(`
    <div class="p-6">
      <h2 class="font-display font-semibold text-lg">You don't have to handle this alone.</h2>
      ${fromCrisisChat? `<p class="text-sm mt-2" style="color:var(--alert);">I noticed something in what you shared that sounded serious. I can stay with you here, but I'm not a replacement for immediate human help.</p>`:''}
      <div class="mt-4 flex flex-col gap-3">
        <div class="p-4 rounded-xl" style="background:var(--alert-light);">
          <div class="font-semibold text-sm" style="color:var(--alert);">Immediate support</div>
          <p class="text-xs mt-1" style="color:var(--ink-soft);">Connect with emergency or crisis support available in your location.</p>
          <div class="mt-2 text-sm"><strong>${r.emergency.label}:</strong> ${r.emergency.value}</div>
          ${r.lines.map(l=>`<div class="text-sm mt-1"><strong>${l.name}:</strong> ${l.value} <span class="text-xs" style="color:var(--ink-soft);">— ${l.note}</span></div>`).join('')}
        </div>
        <a href="#/trusted-contact" onclick="closeModal()" class="p-4 rounded-xl block" style="background:var(--surface-alt);">
          <div class="font-semibold text-sm">Trusted person</div>
          <p class="text-xs mt-1" style="color:var(--ink-soft);">Contact someone you trust.</p>
        </a>
        <a href="#/support" onclick="closeModal()" class="p-4 rounded-xl block" style="background:var(--surface-alt);">
          <div class="font-semibold text-sm">Professional support</div>
          <p class="text-xs mt-1" style="color:var(--ink-soft);">Find qualified mental health support.</p>
        </a>
      </div>
      <p class="text-xs mt-4 font-semibold">Move somewhere safe.</p>
      <p class="text-xs mt-1" style="color:var(--ink-soft);">If you are in immediate danger or believe you may act on thoughts of harming yourself, contact local emergency services or go to the nearest emergency department.</p>
      <button onclick="closeModal()" class="btn btn-outline w-full mt-4">Close</button>
    </div>`);
  },

  /* ---- dev / demo scenarios ---- */
  loadScenario(key){
    const user = authService.currentUser();
    const mk = (stress,sleep,overwhelmed,pressure,hope,motivation,daysBack)=>({ id: uid('ci'), date: daysAgo(daysBack), stress,sleep,overwhelmed,pressure,hope,motivation });
    dataService.update(user.id, d=>{
      d.profile.exam = d.profile.exam || 'NEET';
      d.profile.onboardingComplete = true;
      d.resultPeriodActive = false;
      if(key==='normal'){
        d.phase='preparation';
        d.checkins = [mk(3,7,2,3,7,7,4),mk(4,7,3,4,7,7,3),mk(3,8,2,3,8,8,2),mk(4,7,3,4,7,7,1),mk(3,7,2,3,7,8,0)];
      } else if(key==='mockfail'){
        d.phase='mock';
        d.checkins = [mk(6,5,5,6,5,5,3),mk(7,4,6,6,4,4,2),mk(7,5,6,7,4,4,1),mk(8,4,7,7,3,3,0)];
        d.mockTests.push({ id: uid('mt'), date: todayISO(), score:478, max:720, prevScore:512, note:'Felt rushed in physics section.' });
      } else if(key==='repeated'){
        d.phase='mock';
        d.checkins = [mk(8,3,8,8,3,3,6),mk(7,4,7,8,3,3,5),mk(8,3,8,7,2,2,4),mk(8,4,7,8,3,3,3),mk(9,3,8,9,2,2,2),mk(8,3,8,8,2,3,1),mk(8,4,7,8,3,2,0)];
      } else if(key==='preexam'){
        d.phase='pre-exam';
        d.checkins = [mk(7,4,6,7,4,5,3),mk(8,3,7,8,3,4,2),mk(8,4,7,8,4,4,1),mk(9,3,8,8,3,3,0)];
      } else if(key==='results'){
        d.phase='results'; d.resultPeriodActive = true;
        d.checkins = [mk(8,4,7,7,3,4,2),mk(9,3,8,8,2,3,1),mk(9,4,8,9,2,3,0)];
      } else if(key==='recovery'){
        d.phase='recovery';
        d.checkins = [mk(8,4,7,7,3,3,4),mk(7,5,6,6,4,4,2),mk(6,5,5,6,4,5,0)];
        d.mockTests.push({ id: uid('mt'), date: daysAgo(3), score:410, max:720, prevScore:478, note:'Result period — feeling low.' });
      } else if(key==='crisis'){
        d.phase='recovery';
        d.checkins = [mk(9,3,9,9,1,2,1)];
        d.conversations = [];
      }
    });
    if(key==='crisis'){
      navigate('/chat');
      setTimeout(()=> this.sendChat("I don't see the point in any of this anymore, I feel like giving up completely."), 400);
    } else {
      toast('Demo scenario loaded.');
      navigate('/dashboard');
    }
  },
  loadDemoData(){ this.loadScenario('normal'); }
};

// Explicit globals for reliable interaction when the site is opened as a local file.
window.App = App;
window.aiService = aiService;

function renderChatMessages(msgs){
  if(msgs.length===0) return `<div class="text-center py-8"><p class="text-sm" style="color:var(--ink-soft);">Start a conversation whenever you need a space to talk.</p></div>`;
  return msgs.map(m=>`<div class="msg-bubble ${m.role==='ai'?'msg-ai':'msg-user'}">${esc(m.text)}</div>`).join('');
}
function mapStageToPhase(stage){
  if(!stage) return 'preparation';
  const s = stage.toLowerCase();
  if(s.includes('mock')) return 'mock';
  if(s.includes('final exam')) return 'pre-exam';
  if(s.includes('results') || s.includes('waiting')) return 'results';
  if(s.includes('repeated') || s.includes('drop year')) return 'recovery';
  return 'preparation';
}
